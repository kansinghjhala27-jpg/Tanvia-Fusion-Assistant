name: Build Tanvia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK 35
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 5. Find and extract Tanvia ZIP
      - name: Extract Tanvia project
        run: |
          mkdir -p tanvia_project

          ZIP_FILE=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tanvia ZIP file not found!"
            echo "Files in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d tanvia_project

          echo "Extracted files:"
          find tanvia_project -maxdepth 4 -type f | head -200

      # 6. Find Android project
      - name: Find Android project
        run: |
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find tanvia_project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found!"
            echo "Project files:"
            find tanvia_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Settings file:"
          echo "$SETTINGS_FILE"

      # 7. Install Gradle 8.7
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      # 8. Build APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x ./gradlew

            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.7."

            gradle assembleDebug --stacktrace
          fi

      # 9. Find generated APK
      - name: Find APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK_FILE=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p output
          cp "$APK_FILE" output/Tanvia-Assistant.apk

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tanvia-Assistant-APK
          path: output/Tanvia-Assistant.apk
          if-no-files-found: error
